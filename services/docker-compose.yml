services:
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: "auth_service"
    env_file:
      - ./auth/.env
    environment:
      - MONGO_URI=mongodb://database:27017

  game:
    build:
      context: ./game
      dockerfile: Dockerfile
    container_name: "game_service"
    environment:
      - GATEWAY_URL=http://game:8002


  files:
    build:
      context: ./files
      dockerfile: Dockerfile
    container_name: "files_service"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: "gateway_service"
    env_file:
      - ./gateway/.env
    environment:
      - AUTH_SERVICE_URL=http://auth:8192
      - FILES_SERVICE_URL=http://files:8001
      - GAMESERVICE_URL=http://game:8002
      - GATEWAY_PORT=8000
    depends_on:
      - files
      - auth
      - game

  database:
    image: mongo:8.2.4
    container_name: "mongo_database"
    entrypoint: ["bash", "/scripts/import_data.sh"]
    volumes:
      - ../scripts/import_data.sh:/docker-entrypoint-initdb.d/import_data.sh:ro
      - ./dump:/data/dump