<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="./contact.css">
    <script type="module" src="../../components/burger-menu/burger-menu.js"></script>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script type="module" src="./contact.js"></script>
</head>

<body>
    <div class="contact-page-container">
        <burger-menu></burger-menu>
        <div class="contact-container-find-friends">
            <h2>Find your friends or next enemy</h2>

            <input type="text" id="search-input" placeholder="Search for users...">
            <button id="search-button">Search</button>

            <div class="users-container">
                <h3>User List</h3>
                <ul id="user-list"></ul>
            </div>

        </div>
        <div class="contact-container-friend-requests">
            <h2>Friend Requests</h2>
            <div class="friend-requests-container">
                <h3>Incoming Friend Requests</h3>
                <ul id="incoming-requests-list"></ul>
            </div>
            <div class="friend-requests-container">
                <h3>Outgoing Friend Requests</h3>
                <ul id="outgoing-requests-list"></ul>
            </div>
        </div>
        <div class="contact-container-friends-list">
            <h2>Your Friends</h2>
            <ul id="friend-list"></ul>
        </div>
    </div>
</body>

</html>
