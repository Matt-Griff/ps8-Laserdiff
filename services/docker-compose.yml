services:
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: "auth_service"
    env_file:
      - ./auth/.env
    environment:
      - MONGO_URI=mongodb://database:27017


  files:
    build:
      context: ./files
      dockerfile: Dockerfile
    container_name: "files_service"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    container_name: "gateway_service"
    env_file:
      - ./gateway/.env
    environment:
      - AUTH_SERVICE_URL=http://auth:8192
      - FILES_SERVICE_URL=http://files:8001
      - GATEWAY_PORT=8000
    depends_on:
      - files
      - auth

  database:
    image: mongo:8.2.4
    container_name: "mongo_database"
