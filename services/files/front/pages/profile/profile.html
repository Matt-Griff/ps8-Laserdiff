<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" href="./profile.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script type="module" src="./profile.js"></script>
    <script type="module" src="../../components/notification-duel/notification-duel.js"></script>
</head>

<body>
    <div class="layout">
        <burger-menu id="burger-menu"></burger-menu>
        <div class="profile-container">
            <div class="profile-card">
                <!-- Level at the top -->
                <div class="level-badge"><span class="elo-indicator">67</span></div>

                <!-- Mastery/Icon area -->
                <div class="icon-wrapper">
                    <img src="/assets/edit_hover.png" class="profile-picture" id="edit-profile-picture">
                    <img id="profile-picture" src="" alt="Profile Picture" class="profile-picture">
                    <span class="status-indicator offline"></span>
                </div>

                <!-- Name and Title -->
                <span id="username" class="username">JohnDoe</span>
                <div class="title-text">Laser Diff</div>
                <div class="button-container">
                    <button id="friend-button" disabled>Ask to be friend</button>
                    <button id="send-duel">Ask for a duel</button>
                </div>

                <aside class="league-indicator">
                    <img id="league-icon" src="" alt="League Icon" class="league-icon">
                    <span id="league-name"></span>
                </aside>
            </div>
        </div>
    </div>

    <notification-duel id="notification-duel"></notification-duel>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2>Change Summoner Icon</h2>
            <div class="icon-selector">
                <div id="modal-icon-list" class="modal-icon-list"></div>
            </div>
        </div>
    </div>
</body>

</html>
