<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./signup.css">
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
</head>
<body>
    <script defer src="./signup.js" type="module"></script>
    <script>
        addEventListener('DOMContentLoaded', () => {
            const accessToken = localStorage.getItem('accessToken');
            if(accessToken) {
                window.location.href = '../../home/home.html';
            }
        });
    </script>
    <h1>Sign up</h1>
    <div>
        <img src="/assets/home.jpg" id="background-image">
    </div>
    <form method="POST" id="signup-form">
        <input type="text" id="username" name="username" placeholder="Username" required><br><br>
        <input type="password" id="password" name="password"placeholder="Password" required><br><br>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm password" required><br><br>
        <a href="../login/login.html" id="login-link">Already have an account? Log in</a>
        <input type="submit" value="Sign up">
    </form>
</body>
</html>
