<template id="game-card">
    <div class="game-card">
        <div class="game-info">
            <p class="game-result">Victory</p>
            <img id="opponent-profile-pic" src="https://static.bigbrain.gg/assets/lol/riot_static/16.4.1/img/profileicon/7.png" alt="opp pp" />
            <div class="opponent-details">
                <p class="opponent-username">OpponentUsername</p>
                <p class="game-mode">Local 1 v 1</p>
                <p class="game-date">2024-06-01</p>
            </div>
            <div class="game-stats">
                <p class="turn-count">Turns: 20</p>
                <p class="elo-change">Elo Change: None</p>
            </div>
        </div>
    </div>
</template>
